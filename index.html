    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a1a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }

        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Courier New', monospace; color: #00ff00; }
        #boot-log { width: 90%; max-width: 700px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }

        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f0f23, #1a1a3e); z-index: 99998; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(192,132,252,0.2); border-radius: 20px; padding: 30px; width: 90%; max-width: 350px; text-align: center; }
        .login-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(192,132,252,0.3); color: #e2e8f0; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 16px; outline: none; }

        #panel { position: fixed; top: 0; left: 0; right: 0; height: 35px; background: rgba(10,10,25,0.95); border-bottom: 1px solid rgba(255,255,255,0.05); display: none; align-items: center; padding: 0 10px; gap: 10px; z-index: 1000; }
        .panel-item { padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .panel-item:hover { background: rgba(192,132,252,0.2); }
        .panel-center { margin: 0 auto; font-size: 13px; font-weight: 500; }
        .panel-right { display: flex; gap: 10px; align-items: center; }

        #desktop { width: 100vw; height: calc(100vh - 120px); position: relative; background: radial-gradient(ellipse at center, #0f0f23, #050510); overflow: hidden; display: none; margin-top: 35px; }

        #dock { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(10,10,25,0.9); backdrop-filter: blur(30px); border: 1px solid rgba(192,132,252,0.2); border-radius: 20px; padding: 10px 15px; display: none; gap: 5px; z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-width: 95vw; overflow-x: auto; }
        .dock-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: rgba(255,255,255,0.05); border: none; color: #e2e8f0; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .dock-icon:hover { transform: translateY(-5px) scale(1.1); background: rgba(192,132,252,0.2); }

        #taskbar { height: 35px; background: rgba(10,10,25,0.95); border-top: 1px solid rgba(255,255,255,0.05); display: none; align-items: center; padding: 0 12px; gap: 8px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 999; }
        .start-btn { background: rgba(192,132,252,0.15); border: none; color: #c084fc; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .clock { margin-left: auto; font-size: 11px; color: #a0aec0; }

        .window { position: absolute; min-width: 300px; min-height: 200px; background: rgba(10,10,25,0.92); backdrop-filter: blur(30px); border-radius: 14px; border: 1px solid rgba(192,132,252,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; animation: winOpen 0.25s ease-out; }
        @keyframes winOpen { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .window-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(20,20,40,0.6); cursor: grab; border-bottom: 1px solid rgba(192,132,252,0.08); }
        .window-title { font-size: 13px; color: #e2e8f0; font-weight: 500; }
        .window-controls { display: flex; gap: 8px; }
        .window-controls button { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; font-size: 10px; }
        .close { background: #f7768e; } .minimize { background: #f6ad55; } .maximize { background: #81e6d9; }
        .window-body { flex: 1; padding: 12px; overflow: auto; color: #e2e8f0; font-size: 14px; background: rgba(5,5,15,0.3); }

        .desktop-icon { position: absolute; width: 70px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .desktop-icon:hover { background: rgba(192,132,252,0.1); border-color: rgba(192,132,252,0.2); transform: scale(1.05); }
        .desktop-icon .icon { font-size: 28px; }
        .desktop-icon .label { font-size: 10px; color: #e2e8f0; margin-top: 4px; }

        .terminal { background: #000; color: #00ff00; font-family: monospace; font-size: 13px; padding: 10px; border-radius: 8px; }
        .context-menu { position: fixed; background: rgba(10,10,25,0.95); border: 1px solid rgba(192,132,252,0.3); border-radius: 8px; padding: 8px; min-width: 200px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 70vh; overflow-y: auto; }
        .context-menu button { display: block; width: 100%; background: transparent; border: none; color: #e2e8f0; padding: 8px 12px; text-align: left; cursor: pointer; border-radius: 4px; font-size: 13px; font-family: inherit; }
        .context-menu button:hover { background: rgba(192,132,252,0.2); }

        @media (max-width: 768px) {
            .window { width: 95vw !important; height: 70vh !important; left: 2.5vw !important; top: 5vh !important; min-width: unset; }
            .desktop-icon { width: 60px; height: 60px; }
            .dock-icon { width: 35px; height: 35px; font-size: 15px; }
        }
    </style>
</head>

    <script>
        const bootMessages = [
            'BIOS: Nova Virtual BIOS v7.1', 'CPU: Nova Virtual CPU @ 7.1GHz',
            'RAM: 16384MB detected', 'Loading Linux 7.1.10-nova...',
            'Loading 50+ applications...', 'Loading games...',
            'Loading utilities...', 'EXT4-fs mounted',
            'Welcome to Nova OS 7.1.10 Final!'
        ];

        function bootSystem() {
            const bootLog = document.getElementById('boot-log');
            let i = 0;
            function next() {
                if (i < bootMessages.length) {
                    bootLog.innerHTML += `<div style="color:#00ff00;">[OK] ${bootMessages[i]}</div>`;
                    i++; setTimeout(next, 70);
                } else setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                }, 500);
            }
            next();
        }

        class MultiLanguageSystem {
            constructor() { this.languages = { js: { name: 'JavaScript', ready: true }, ts: { name: 'TypeScript', ready: true }, python: { name: 'Python', ready: false }, sql: { name: 'SQL', ready: false }, php: { name: 'PHP', ready: true }, ruby: { name: 'Ruby', ready: true }, lua: { name: 'Lua', ready: true } }; this.pyodide = null; this.sqlDb = null; }
            async initAll() { try { this.pyodide = await loadPyodide(); this.languages.python.ready = true; } catch (e) {} try { const initSqlJs = window.initSqlJs; if (initSqlJs) { this.sqlDb = await initSqlJs({ locateFile: f => `https://sql.js.org/dist/${f}` }); this.languages.sql.ready = true; } } catch (e) {} }
            getStatus() { return Object.entries(this.languages).map(([k, l]) => `${l.name}: ${l.ready ? '✅' : '❌'}`).join('\n'); }
            async execute(lang, code) {
                switch(lang) {
                    case 'js': try { return String(eval(code)); } catch (e) { return 'JS Error'; }
                    case 'ts': try { const js = ts.transpileModule(code, { compilerOptions: { module: ts.ModuleKind.ESNext } }).outputText; return String(eval(js)); } catch (e) { return 'TS Error'; }
                    case 'python': if (!this.pyodide) return 'Python не загружен'; try { return String(await this.pyodide.runPythonAsync(code)); } catch (e) { return 'Python Error'; }
                    case 'sql': if (!this.sqlDb) return 'SQLite не загружен'; try { const db = new this.sqlDb.Database(); const r = db.exec(code); return r.length ? JSON.stringify(r) : 'Выполнено'; } catch (e) { return 'SQL Error'; }
                    case 'php': return code.includes('echo') ? code.match(/echo\s+"([^"]+)"/)?.[1] || 'PHP' : 'PHP';
                    case 'ruby': return code.includes('puts') ? code.match(/puts\s+"([^"]+)"/)?.[1] || 'Ruby' : 'Ruby';
                    case 'lua': return code.includes('print') ? code.match(/print\("([^"]+)"\)/)?.[1] || 'Lua' : 'Lua';
                    default: return 'Unknown';
                }
            }
        }

        class LinuxSystem {
            constructor() {
                this.hostname = 'nova-os'; this.kernel = '7.1.10-nova';
                this.currentUser = null; this.currentPath = '/home/nova';
                this.processes = []; this.history = [];
                this.users = { root: { password: 'root', uid: 0, home: '/root' }, nova: { password: '1234', uid: 1000, home: '/home/nova' } };
                this.fs = this.initFS();
                this.packages = ['bash','coreutils','systemd','vim','nano','gcc','python3','nodejs','php','ruby','lua','sqlite','firefox','docker','git','ssh','cron','tetris','minesweeper','2048','gimp','libreoffice','vlc','chess','pong'];
                this.multiLang = new MultiLanguageSystem();
                this.init();
            }
            initFS() { return { '/': { type: 'dir', children: { 'bin': { type: 'dir', children: {} }, 'etc': { type: 'dir', children: { 'hostname': { type: 'file', content: 'nova-os\n' } } }, 'home': { type: 'dir', children: { 'nova': { type: 'dir', children: { 'Documents': { type: 'dir', children: {} }, 'Downloads': { type: 'dir', children: {} }, 'Pictures': { type: 'dir', children: {} }, 'Music': { type: 'dir', children: {} }, 'readme.txt': { type: 'file', content: 'Welcome!\n' } } }, 'root': { type: 'dir', children: {} } } }, 'tmp': { type: 'dir', children: {} }, 'usr': { type: 'dir', children: {} }, 'var': { type: 'dir', children: {} } } } }; }
            init() { this.processes.push({ pid: 1, name: 'systemd', user: 'root', cpu: 0.1, mem: 100 }); this.processes.push({ pid: 2, name: 'Xorg', user: 'root', cpu: 2, mem: 200 }); this.processes.push({ pid: 3, name: 'gnome-shell', user: 'nova', cpu: 3, mem: 300 }); }
            login(u, p) { const user = this.users[u]; if (user && user.password === p) { this.currentUser = u; this.currentPath = user.home; return true; } return false; }
            getNode(path) { if (path === '/') return this.fs['/']; const parts = path.split('/').filter(p => p); let cur = this.fs['/']; for (const part of parts) { if (!cur.children?.[part]) return null; cur = cur.children[part]; } return cur; }
            listDir(path) { const node = this.getNode(path); return node?.type === 'dir' ? Object.keys(node.children) : []; }
            createFile(path, name, content = '') { const node = this.getNode(path); if (node?.type !== 'dir' || node.children[name]) return false; node.children[name] = { type: 'file', content }; return true; }
            createDir(path, name) { const node = this.getNode(path); if (node?.type !== 'dir' || node.children[name]) return false; node.children[name] = { type: 'dir', children: {} }; return true; }
            deleteNode(path, name) { const node = this.getNode(path); if (node?.type !== 'dir' || !node.children[name]) return false; delete node.children[name]; return true; }
            readFile(path) { const node = this.getNode(path); return node?.type === 'file' ? node.content : null; }
            async execute(cmd) {
                if (cmd.includes('|')) { const cmds = cmd.split('|').map(c => c.trim()); let out = ''; for (const c of cmds) out = await this.execSingle(c, out); return out; }
                return await this.execSingle(cmd, '');
            }
            async execSingle(cmd, input = '') {
                const [command, ...args] = cmd.trim().split(' ');
                switch(command) {
                    case 'ls': { const f = this.listDir(this.currentPath); if (args[0] === '-la') { let r = 'total ' + f.length * 4 + '\n'; f.forEach(x => { const n = this.getNode(this.currentPath + '/' + x); r += `${n.type === 'dir' ? 'd' : '-'}rwxr-xr-x ${this.currentUser} ${this.currentUser} ${String(n.type === 'file' ? (n.content || '').length : 4096).padStart(6)} ${x}\n`; }); return r; } return f.join('  ') || ''; }
                    case 'pwd': return this.currentPath;
                    case 'cd': { const t = !args[0] || args[0] === '~' ? this.users[this.currentUser].home : args[0] === '..' ? this.currentPath.split('/').slice(0, -1).join('/') || '/' : args[0] === '/' ? '/' : args[0].startsWith('/') ? args[0] : this.currentPath + '/' + args[0]; const n = this.getNode(t); if (n?.type === 'dir') { this.currentPath = t; return ''; } return 'No such file'; }
                    case 'cat': return args[0] ? (this.readFile(this.currentPath + '/' + args[0]) ?? 'No such file') : input;
                    case 'echo': return args.join(' ');
                    case 'grep': { const p = args[0]; const t = input || (args[1] ? this.readFile(this.currentPath + '/' + args[1]) : ''); return t ? t.split('\n').filter(l => l.includes(p)).join('\n') : ''; }
                    case 'mkdir': return args[0] && this.createDir(this.currentPath, args[0]) ? '' : 'Error';
                    case 'touch': return args[0] && this.createFile(this.currentPath, args[0]) ? '' : 'Error';
                    case 'rm': return args[0] && this.deleteNode(this.currentPath, args[0]) ? '' : 'Error';
                    case 'cp': { if (args[0] && args[1]) { const c = this.readFile(this.currentPath + '/' + args[0]); if (c !== null) { this.createFile(this.currentPath, args[1], c); return ''; } } return 'Error'; }
                    case 'mv': { if (args[0] && args[1]) { const c = this.readFile(this.currentPath + '/' + args[0]); if (c !== null) { this.deleteNode(this.currentPath, args[0]); this.createFile(this.currentPath, args[1], c); return ''; } } return 'Error'; }
                    case 'whoami': return this.currentUser;
                    case 'hostname': return this.hostname;
                    case 'uname': return args[0] === '-a' ? `Linux ${this.hostname} ${this.kernel} x86_64` : 'Linux';
                    case 'date': return new Date().toString();
                    case 'ps': { let r = 'PID TTY TIME CMD\n'; this.processes.forEach(p => r += `${String(p.pid).padEnd(4)} ? 00:00:00 ${p.name}\n`); return r; }
                    case 'df': return '/dev/sda1 20G 3.5G 16G 18% /';
                    case 'free': return 'Mem: 16384000 4915200 11468800';
                    case 'apt': { if (args[0] === 'list') return this.packages.join('\n'); return 'Usage: apt list'; }
                    case 'sudo': return 'nova is not in the sudoers file.';
                    case 'clear': return 'CLEAR';
                    case 'history': return this.history.map((c, i) => ` ${i+1} ${c}`).join('\n');
                    case 'ssh': return args[0] ? 'Connecting...' : 'Usage: ssh user@host';
                    case 'wget': return args[0] ? 'Downloading... Done' : 'Usage: wget <url>';
                    case 'docker': return 'CONTAINER ID IMAGE STATUS';
                    case 'git': return 'On branch main';
                    case 'crontab': return '*/5 * * * * /usr/bin/backup.sh';
                    case 'tar': return 'Creating archive...';
                    case 'systemctl': return 'active (running)';
                    case 'useradd': return args[0] ? 'User created' : 'Usage: useradd <user>';
                    case 'chmod': return args[0] ? 'Permissions changed' : 'Usage: chmod <mode> <file>';
                    case 'mount': return '/dev/sda1 on / type ext4 (rw)';
                    case 'find': return 'No files';
                    case 'which': return args[0] ? `/usr/bin/${args[0]}` : 'Usage: which <cmd>';
                    case 'js': return await this.multiLang.execute('js', args.join(' '));
                    case 'ts': return await this.multiLang.execute('ts', args.join(' '));
                    case 'python': return await this.multiLang.execute('python', args.join(' '));
                    case 'sql': return await this.multiLang.execute('sql', args.join(' '));
                    case 'php': return await this.multiLang.execute('php', args.join(' '));
                    case 'ruby': return await this.multiLang.execute('ruby', args.join(' '));
                    case 'lua': return await this.multiLang.execute('lua', args.join(' '));
                    case 'languages': return this.multiLang.getStatus();
                    case 'help': return '80+ commands';
                    case '': return '';
                    default: return `bash: ${command}: command not found`;
                }
            }
        }

        let linux = new LinuxSystem();
        let windowIdCounter = 0;
        let windows = [];
        let zIndexCounter = 100;
        let notifications = [];

        async function login() {
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            if (linux.login(u, p)) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
                document.getElementById('taskbar').style.display = 'flex';
                document.getElementById('panel').style.display = 'flex';
                document.getElementById('dock').style.display = 'flex';
                initDesktop();
                await linux.multiLang.initAll();
                notify('🐧 Nova OS 7.1.10 Final! 50+ приложений!');
            } else alert('Login incorrect');
        }

        function notify(message) {
            notifications.push(message);
            const n = document.createElement('div');
            n.style.cssText = 'position:fixed;top:45px;right:20px;background:rgba(10,10,25,0.95);border:1px solid rgba(192,132,252,0.3);border-radius:8px;padding:12px 20px;z-index:99999;font-size:14px;';
            n.textContent = message;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        function createWindow(title, content, width = 500, height = 400) {
            const id = ++windowIdCounter;
            const win = document.createElement('div');
            win.className = 'window';
            win.style.cssText = `width:${width}px;height:${height}px;left:${50+Math.random()*200}px;top:${40+Math.random()*100}px;z-index:${++zIndexCounter};`;
            win.dataset.windowId = id;
            win.innerHTML = `<div class="window-header"><span class="window-title">${title}</span><div class="window-controls"><button class="minimize" onclick="minWin(${id})">−</button><button class="maximize" onclick="maxWin(${id})">+</button><button class="close" onclick="closeWin(${id})">×</button></div></div><div class="window-body">${content}</div>`;
            document.body.appendChild(win);
            const taskBtn = document.createElement('button');
            taskBtn.textContent = title;
            taskBtn.style.cssText = 'background:rgba(192,132,252,0.08);border:1px solid rgba(192,132,252,0.08);color:#e2e8f0;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
            taskBtn.onclick = () => { win.style.display = win.style.display === 'none' ? 'flex' : 'none'; };
            document.getElementById('taskbar-apps').appendChild(taskBtn);
            windows.push({ id, element: win, taskBtn });
            const header = win.querySelector('.window-header');
            let dragging = false, ox, oy;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.window-controls')) return;
                dragging = true; const r = win.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top;
                win.style.zIndex = ++zIndexCounter;
                document.addEventListener('mousemove', drag);
                document.addEventListener('mouseup', () => { dragging = false; document.removeEventListener('mousemove', drag); });
            });
            function drag(e) { if (dragging) { win.style.left = (e.clientX - ox) + 'px'; win.style.top = (e.clientY - oy) + 'px'; } }
            return id;
        }

        function closeWin(id) { const i = windows.findIndex(w => w.id === id); if (i !== -1) { windows[i].element.remove(); windows[i].taskBtn.remove(); windows.splice(i, 1); } }
        function minWin(id) { const w = windows.find(w => w.id === id); if (w) w.element.style.display = w.element.style.display === 'none' ? 'flex' : 'none'; }
        function maxWin(id) { const w = windows.find(w => w.id === id); if (w) { if (w.element.style.width === '100vw') { w.element.style.width = '500px'; w.element.style.height = '400px'; } else { w.element.style.width = '100vw'; w.element.style.height = 'calc(100vh - 70px)'; w.element.style.left = '0'; w.element.style.top = '35px'; } } }

                ['📌 Заметки', openStickyNotes], ['⏰ Напоминания', openReminder], ['✉️ Почта', openEmailClient],
                ['💾 Диски', openDiskAnalyzer], ['📦 Архиватор', openArchiveManager], ['🗄️ БД', openDatabaseManager],
                ['💿 Дефрагментация', openDefragmenter], ['🔄 Обновление', openSystemUpdate], ['📡 Устройства', openDeviceManager],
                ['🎤 Запись', openAudioRecorder], ['💬 Мессенджер', openMessenger], ['📥 Торрент', openTorrent],
                ['📖 RSS', openRSSReader], ['⚗️ Таблица', openPeriodicTable], ['📐 Конвертер', openUnitConverter],
                ['📈 График', openGraphCalculator], ['🔐 Пароли', openPasswordManager], ['🔒 VPN', openVPN],
                ['🔍 Лупа', openMagnifier], ['🧹 Очистка', openSystemCleaner], ['💾 Резервное', openBackup],
                ['🔑 Генератор', openPasswordGenerator], ['📱 QR', openQRGenerator], ['🎵 Метроном', openMetronome],
                ['⚙️ Настройки', openSettings], ['🗑️ Корзина', openTrash]
            ];
            apps.forEach(([name, action]) => { const btn = document.createElement('button'); btn.textContent = name; btn.onclick = () => { action(); menu.remove(); }; menu.appendChild(btn); });
            document.body.appendChild(menu);
            setTimeout(() => document.addEventListener('click', (e) => { if (!menu.contains(e.target)) menu.remove(); }, { once: true }), 10);
        }

        function initDesktop() {
            function updateClock() {
                const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('clock').textContent = time;
                document.getElementById('panel-clock').textContent = time;
            }
            setInterval(updateClock, 1000); updateClock();
            const icons = [
                ['📁', 'Документы', openFileManager, 20, 20],
                ['🗑️', 'Корзина', openTrash, 110, 20],
                ['💻', 'Терминал', openTerminal, 200, 20]
            ];
            icons.forEach(([icon, label, action, x, y]) => {
                const el = document.createElement('div');
                el.className = 'desktop-icon';
                el.style.left = x + 'px'; el.style.top = y + 'px';
                el.innerHTML = `<div class="icon">${icon}</div><div class="label">${label}</div>`;
                el.onclick = action;
                document.getElementById('desktop').appendChild(el);
            });
        }

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px';
            const items = [['🔄 Обновить', () => location.reload()], ['⚙️ Настройки', openSettings]];
            items.forEach(([label, action]) => { const btn = document.createElement('button'); btn.textContent = label; btn.onclick = () => { action(); menu.remove(); }; menu.appendChild(btn); });
            document.body.appendChild(menu);
            document.addEventListener('click', () => menu.remove(), { once: true });
        });

        bootSystem();
