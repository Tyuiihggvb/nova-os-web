<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 Nova OS v2.0 ULTIMATE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; color: #e2e8f0; 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            font-family: monospace; color: #00ff00;
        }
        #boot-text { margin-top: 20px; font-size: 14px; white-space: pre-wrap; }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e); z-index: 9998;
            display: none; align-items: center; justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(100,100,255,0.3);
            border-radius: 20px; padding: 40px; width: 350px; text-align: center;
        }
        .login-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(100,100,255,0.3);
            color: #e2e8f0; padding: 12px; border-radius: 8px; margin: 10px 0;
            font-size: 16px; outline: none;
        }
        .login-btn {
            width: 100%; background: linear-gradient(135deg, #6464ff, #a855f7);
            border: none; color: white; padding: 12px; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        #desktop {
            flex: 1; position: relative; overflow: hidden;
            background: radial-gradient(ellipse at center, #1a1a3e, #0a0a1a);
            display: none;
        }

        #taskbar {
            height: 45px; background: rgba(10,10,25,0.95);
            display: none; align-items: center; padding: 0 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .start-btn {
            background: rgba(100,100,255,0.2); border: 1px solid rgba(100,100,255,0.4);
            color: #a0a0ff; padding: 8px 18px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .start-btn:hover { background: rgba(100,100,255,0.4); }

        #taskbar-apps { display: flex; gap: 5px; margin-left: 15px; }
        #clock { margin-left: auto; color: #a0aec0; font-size: 13px; }

        .window {
            position: absolute; min-width: 350px; min-height: 250px;
            background: rgba(15,15,35,0.95); border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; overflow: hidden;
            animation: winOpen 0.3s ease-out;
        }
        @keyframes winOpen { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .window-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(20,20,40,0.9);
            cursor: grab; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .window-title { font-size: 13px; font-weight: 500; }
        .window-controls { display: flex; gap: 8px; }
        .window-controls button {
            width: 14px; height: 14px; border-radius: 50%;
            border: none; cursor: pointer; font-size: 10px;
        }
        .close { background: #ff5555; }
        .minimize { background: #ffb86c; }
        .maximize { background: #50fa7b; }
        .window-body { flex: 1; padding: 15px; overflow: auto; }

        .desktop-icon {
            position: absolute; width: 80px; height: 80px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer;
            border-radius: 12px; transition: all 0.2s;
        }
        .desktop-icon:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }
        .desktop-icon .icon { font-size: 35px; }
        .desktop-icon .label { font-size: 11px; margin-top: 5px; }

        #terminal {
            background: #000; color: #00ff00; font-family: 'Courier New', monospace;
            padding: 12px; border-radius: 10px; height: 100%;
            overflow-y: auto; white-space: pre-wrap; font-size: 13px;
        }
        #terminal-input {
            background: transparent; border: none; color: #00ff00;
            font-family: 'Courier New', monospace; font-size: 13px;
            outline: none; width: 100%;
        }

        .context-menu {
            position: fixed; background: rgba(15,15,35,0.98);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
            padding: 5px; min-width: 200px; z-index: 9999; display: none;
        }
        .context-menu button {
            display: block; width: 100%; background: transparent;
            border: none; color: #e2e8f0; padding: 10px 15px;
            text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px;
        }
        .context-menu button:hover { background: rgba(100,100,255,0.3); }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div style="font-size: 50px;">🌐</div>
        <div style="font-size: 26px; color: #a0a0ff; margin-top: 10px;">Nova OS v2.0 ULTIMATE</div>
        <div id="boot-text"></div>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <div style="font-size: 50px; margin-bottom: 10px;">🌐</div>
            <div style="font-size: 22px; margin-bottom: 20px; color: #a0a0ff;">Nova OS</div>
            <input type="text" id="login-user" class="login-input" placeholder="Логин" value="nova">
            <input type="password" id="login-pass" class="login-input" placeholder="Пароль" value="1234">
            <button class="login-btn" onclick="login()">Войти</button>
        </div>
    </div>

    <div id="desktop"></div>

    <div id="taskbar">
        <button class="start-btn" onclick="toggleStartMenu()">🌐 Пуск</button>
        <div id="taskbar-apps"></div>
        <div id="clock"></div>
    </div>

    <div class="context-menu" id="context-menu"></div>

    <script>
        // ============ ЗАГРУЗКА ============
        const bootMessages = [
            'Nova OS BIOS v2.0',
            'CPU: Web Core @ 5.0GHz',
            'RAM: 16GB detected',
            'Loading kernel v2.0...',
            'Loading 100+ commands...',
            'Loading themes...',
            'Loading games...',
            'Welcome to Nova OS v2.0 ULTIMATE!'
        ];

        let bootIndex = 0;
        function bootSequence() {
            if (bootIndex < bootMessages.length) {
                document.getElementById('boot-text').textContent += '[OK] ' + bootMessages[bootIndex] + '\n';
                bootIndex++;
                setTimeout(bootSequence, 300);
            } else {
                setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                }, 500);
            }
        }
        bootSequence();

        // ============ СИСТЕМА ============
        let currentUser = 'nova';
        let isRoot = true;
        let currentPath = '/home/nova';
        let zIndex = 100;
        let terminalLines = [];
        let currentInput = '';
        let stats = { commands: 0, filesCreated: 0, hacks: 0 };
        let achievements = [];

        const Themes = {
            Dark: { bg: '#0a0a1a', text: '#e2e8f0', accent: '#6464ff' },
            Matrix: { bg: '#000000', text: '#00ff00', accent: '#00ff00' },
            Ocean: { bg: '#0a192f', text: '#ffffff', accent: '#00c8ff' },
            Sunset: { bg: '#321010', text: '#ffc896', accent: '#ff6432' },
            Purple: { bg: '#140028', text: '#ffffff', accent: '#c864ff' },
        };

        let currentTheme = 'Dark';

        const FileSystem = {
            '/home/nova': {
                type: 'dir',
                children: {
                    'Documents': { type: 'dir', children: {} },
                    'Downloads': { type: 'dir', children: {} },
                    'readme.txt': { type: 'file', content: 'Welcome to Nova OS v2.0!' },
                    'secret.txt': { type: 'file', content: '42 is the answer' },
                }
            },
            '/etc': {
                type: 'dir',
                children: {
                    'hostname': { type: 'file', content: 'nova-os' },
                }
            }
        };

        const Aliases = {
            'll': 'ls', 'cl': 'clear', 'q': 'exit', 'nf': 'neofetch',
            'st': 'stats', 'ach': 'achievements', 'th': 'theme',
        };

        // ============ ЛОГИН ============
        function login() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            if (user === 'nova' && pass === '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
                document.getElementById('taskbar').style.display = 'flex';
                initDesktop();
            } else {
                alert('Неверный логин или пароль!');
            }
        }

        // ============ РАБОЧИЙ СТОЛ ============
        function initDesktop() {
            createDesktopIcons();
            updateClock();
            setInterval(updateClock, 1000);
            unlockAchievement('Первый запуск');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = 
                now.toLocaleTimeString('ru-RU') + ' ' + now.toLocaleDateString('ru-RU');
        }

        function createDesktopIcons() {
            const icons = [
                { icon: '💻', label: 'Терминал', action: openTerminal },
                { icon: '📁', label: 'Файлы', action: openFiles },
                { icon: '📝', label: 'Заметки', action: openNotes },
                { icon: '🧮', label: 'Калькулятор', action: openCalculator },
                { icon: '🎮', label: 'Змейка', action: openSnake },
                { icon: '📊', label: 'Монитор', action: openMonitor },
                { icon: '🎨', label: 'Темы', action: openThemes },
            ];
            icons.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'desktop-icon';
                el.style.left = (20 + i * 90) + 'px';
                el.style.top = '20px';
                el.innerHTML = `<div class="icon">${item.icon}</div><div class="label">${item.label}</div>`;
                el.onclick = item.action;
                el.ondblclick = item.action;
                document.getElementById('desktop').appendChild(el);
            });
        }

        // ============ ОКНА ============
        function createWindow(title, content) {
            const win = document.createElement('div');
            win.className = 'window';
            win.style.left = (50 + Math.random() * 200) + 'px';
            win.style.top = (30 + Math.random() * 100) + 'px';
            win.style.zIndex = ++zIndex;
            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${title}</span>
                    <div class="window-controls">
                        <button class="minimize">−</button>
                        <button class="maximize">+</button>
                        <button class="close">×</button>
                    </div>
                </div>
                <div class="window-body">${content}</div>
            `;
            document.getElementById('desktop').appendChild(win);
            
            const taskBtn = document.createElement('button');
            taskBtn.textContent = title;
            taskBtn.style.cssText = 'background:rgba(100,100,255,0.2);border:1px solid rgba(100,100,255,0.3);color:#e2e8f0;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;';
            document.getElementById('taskbar-apps').appendChild(taskBtn);
            
            win.querySelector('.close').onclick = () => { win.remove(); taskBtn.remove(); };
            win.querySelector('.minimize').onclick = () => { win.style.display = 'none'; };
            win.querySelector('.maximize').onclick = function() {
                if (win.style.width === '100%') {
                    win.style.width = '400px'; win.style.height = '300px';
                } else {
                    win.style.width = '100%'; win.style.height = '100%';
                    win.style.left = '0'; win.style.top = '0';
                }
            };
            taskBtn.onclick = () => { win.style.display = win.style.display === 'none' ? 'block' : 'none'; };
            
            makeDraggable(win);
            return win;
        }

        function makeDraggable(win) {
            const header = win.querySelector('.window-header');
            let dragging = false, ox, oy;
            header.addEventListener('mousedown', (e) => {
                dragging = true; ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop;
                win.style.zIndex = ++zIndex;
            });
            document.addEventListener('mousemove', (e) => {
                if (dragging) { win.style.left = (e.clientX - ox) + 'px'; win.style.top = (e.clientY - oy) + 'px'; }
            });
            document.addEventListener('mouseup', () => dragging = false);
        }

        // ============ ТЕРМИНАЛ ============
        function openTerminal() {
            const win = createWindow('💻 Терминал', `
                <div id="terminal">
                    <div>Nova OS Terminal v2.0 — 100+ команд</div>
                    <div>Type 'help' for commands</div>
                    <div><span style="color:#a0a0ff;">${currentUser}@nova-os:${currentPath}$</span> <input id="terminal-input" type="text" placeholder=""></div>
                </div>
            `);
            const input = win.querySelector('#terminal-input');
            input.focus();
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    executeCommand(input.value, win);
                    input.value = '';
                }
            });
        }

        function executeCommand(cmd, win) {
            stats.commands++;
            const terminal = win.querySelector('#terminal');
            const parts = cmd.trim().split(' ');
            const command = parts[0].toLowerCase();
            const args = parts.slice(1);
            
            let output = '';
            
            switch(command) {
                case 'help': output = 'ls, cd, pwd, cat, mkdir, touch, rm, echo, clear, neofetch, stats, achievements, theme, hack, googol, quantum, matrix, snake, whoami, date, uptime, df, free'; break;
                case 'ls': {
                    const node = FileSystem[currentPath];
                    output = Object.keys(node.children || {}).join('  ');
                    break;
                }
                case 'pwd': output = currentPath; break;
                case 'cd': {
                    if (!args[0] || args[0] === '~') currentPath = '/home/nova';
                    else output = '❌ Directory not found';
                    break;
                }
                case 'cat': {
                    const node = FileSystem[currentPath];
                    if (node.children[args[0]]) output = node.children[args[0]].content || '';
                    else output = '❌ File not found';
                    break;
                }
                case 'mkdir': {
                    FileSystem[currentPath].children[args[0]] = { type: 'dir', children: {} };
                    stats.filesCreated++;
                    output = '✅ Created: ' + args[0];
                    break;
                }
                case 'touch': {
                    FileSystem[currentPath].children[args[0]] = { type: 'file', content: '' };
                    stats.filesCreated++;
                    output = '✅ Created: ' + args[0];
                    break;
                }
                case 'rm': {
                    delete FileSystem[currentPath].children[args[0]];
                    output = '✅ Deleted';
                    break;
                }
                case 'echo': output = args.join(' '); break;
                case 'clear': terminal.innerHTML = ''; return;
                case 'neofetch': output = '🌐 OS: Nova OS v2.0\n   Kernel: 2.0\n   CPU: Web Core @ 5.0GHz\n   RAM: 16GB'; break;
                case 'whoami': output = currentUser; break;
                case 'date': output = new Date().toString(); break;
                case 'uptime': output = 'Uptime: ' + Math.floor((Date.now() - startTime) / 1000) + 's'; break;
                case 'df': output = '💾 /dev/web 16GB 4GB 12GB 25% /'; break;
                case 'free': output = '🧠 Total: 16GB | Used: 4GB | Free: 12GB'; break;
                case 'stats': output = `📊 Commands: ${stats.commands}\n   Files: ${stats.filesCreated}\n   Hacks: ${stats.hacks}`; break;
                case 'achievements': output = achievements.length ? achievements.join('\n') : 'No achievements'; break;
                case 'theme': {
                    if (Themes[args[0]]) {
                        currentTheme = args[0];
                        applyTheme(args[0]);
                        output = '🎨 Theme: ' + args[0];
                    } else output = '❌ Themes: Dark, Matrix, Ocean, Sunset, Purple';
                    break;
                }
                case 'hack': {
                    stats.hacks++;
                    unlockAchievement('Хакер');
                    output = '🚀 HACKING...\n[+] Bypassing...\n✅ HACKED!';
                    break;
                }
                case 'googol': output = '⚛️ ' + '1' + '0'.repeat(100); break;
                case 'quantum': output = '⚛️ Superposition: 0 and 1 simultaneously'; break;
                case 'matrix': output = 'Wake up, Neo...\nThe Matrix has you...'; break;
                case 'snake': output = '🐍 Snake game loaded! (coming soon)'; break;
                default: output = '❌ Command not found: ' + command;
            }
            
            if (output) {
                terminal.innerHTML += `<div style="color:#a0a0ff;">${currentUser}@nova-os:${currentPath}$ ${cmd}</div>`;
                terminal.innerHTML += `<div style="white-space:pre-wrap;">${output}</div>`;
                terminal.innerHTML += `<div><span style="color:#a0a0ff;">${currentUser}@nova-os:${currentPath}$</span> <input id="terminal-input" type="text"></div>`;
                terminal.scrollTop = terminal.scrollHeight;
                const newInput = terminal.querySelector('#terminal-input:last-child');
                newInput.focus();
                newInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { executeCommand(newInput.value, win); newInput.value = ''; }
                });
            }
        }

        // ============ ДОСТИЖЕНИЯ ============
        function unlockAchievement(name) {
            if (!achievements.includes(name)) {
                achievements.push('🏆 ' + name);
                showNotification('🏆 Достижение: ' + name);
            }
        }

        function showNotification(msg) {
            const n = document.createElement('div');
            n.style.cssText = 'position:fixed;top:20px;right:20px;background:rgba(15,15,35,0.95);border:1px solid rgba(100,100,255,0.4);border-radius:10px;padding:15px 20px;z-index:9999;';
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        // ============ ТЕМЫ ============
        function applyTheme(name) {
            const theme = Themes[name];
            document.body.style.background = theme.bg;
            document.body.style.color = theme.text;
            document.getElementById('desktop').style.background = `radial-gradient(ellipse at center, ${theme.bg}, #0a0a1a)`;
            showNotification('🎨 Тема: ' + name);
        }

        // ============ ПРИЛОЖЕНИЯ ============
        function openFiles() {
            createWindow('📁 Файлы', `<div id="files-list"></div>`);
        }

        function openNotes() {
            createWindow('📝 Заметки', `<textarea style="width:100%;height:200px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#e2e8f0;padding:10px;border-radius:8px;" placeholder="Заметка..."></textarea>`);
        }

        function openCalculator() {
            createWindow('🧮 Калькулятор', `
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
                    ${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(b => 
                        `<button style="padding:15px;background:rgba(100,100,255,0.2);border:none;color:#e2e8f0;border-radius:8px;cursor:pointer;font-size:18px;" onclick="this.textContent">${b}</button>`
                    ).join('')}
                </div>
            `);
        }

        function openSnake() {
            createWindow('🎮 Змейка', `<canvas id="snake-canvas" width="300" height="300" style="border:1px solid #6464ff;border-radius:8px;"></canvas>`);
        }

        function openMonitor() {
            createWindow('📊 Монитор', `<canvas id="monitor-canvas" width="300" height="150"></canvas>`);
        }

        function openThemes() {
            createWindow('🎨 Темы', `
                ${Object.keys(Themes).map(t => 
                    `<button onclick="applyTheme('${t}')" style="display:block;width:100%;background:${Themes[t].bg};border:1px solid ${Themes[t].accent};color:${Themes[t].text};padding:12px;border-radius:8px;cursor:pointer;margin-bottom:8px;">${t}</button>`
                ).join('')}
            `);
        }

        // ============ МЕНЮ ============
        function toggleStartMenu() {
            const menu = document.getElementById('context-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            menu.style.left = '10px'; menu.style.bottom = '55px';
            menu.innerHTML = `
                <button onclick="openTerminal();closeMenu()">💻 Терминал</button>
                <button onclick="openFiles();closeMenu()">📁 Файлы</button>
                <button onclick="openNotes();closeMenu()">📝 Заметки</button>
                <button onclick="openCalculator();closeMenu()">🧮 Калькулятор</button>
                <button onclick="openSnake();closeMenu()">🎮 Змейка</button>
                <button onclick="openMonitor();closeMenu()">📊 Монитор</button>
                <button onclick="openThemes();closeMenu()">🎨 Темы</button>
            `;
        }

        function closeMenu() { document.getElementById('context-menu').style.display = 'none'; }

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const menu = document.getElementById('context-menu');
            menu.style.display = 'block';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            menu.innerHTML = `
                <button onclick="location.reload()">🔄 Обновить</button>
                <button onclick="openTerminal()">💻 Терминал</button>
                <button onclick="openThemes()">🎨 Темы</button>
            `;
        });

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('context-menu');
            if (!menu.contains(e.target)) menu.style.display = 'none';
        });

        const startTime = Date.now();
    </script>
</body>
</html>
