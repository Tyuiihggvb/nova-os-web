<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧊 Nova OS Ultimate 3.0 — Максимум</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a1a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }

        #desktop { width: 100vw; height: calc(100vh - 60px); position: relative; background: radial-gradient(ellipse at center, #0f0f23, #050510); transition: background 0.8s; }
        .workspace { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .workspace.active { display: block; }

        #dock { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(20,20,40,0.7); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 8px 16px; display: flex; gap: 6px; z-index: 999; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: all 0.3s; }
        #dock:hover { transform: translateX(-50%) scale(1.02); }
        .dock-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(255,255,255,0.05); border: none; color: #e2e8f0; cursor: pointer; transition: all 0.2s; position: relative; }
        .dock-icon:hover { transform: translateY(-8px) scale(1.1); background: rgba(192,132,252,0.2); box-shadow: 0 8px 25px rgba(192,132,252,0.2); }
        .dock-icon .dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #c084fc; display: none; }
        .dock-icon.active .dot { display: block; }

        #taskbar { height: 60px; background: rgba(10,10,25,0.85); backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 16px; gap: 12px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; }
        #taskbar .start-btn { background: rgba(192,132,252,0.15); border: none; color: #c084fc; font-size: 18px; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        #taskbar .start-btn:hover { background: rgba(192,132,252,0.25); }
        #taskbar .start-btn span { font-size: 13px; font-weight: 500; }
        #taskbar .clock { margin-left: auto; font-size: 14px; color: #a0aec0; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
        #taskbar .clock .date { font-size: 11px; color: #718096; }
        #taskbar-apps { display: flex; gap: 4px; flex: 1; overflow: hidden; justify-content: center; }
        #taskbar-apps button { background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.08); color: #e2e8f0; padding: 4px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
        #taskbar-apps button:hover { background: rgba(192,132,252,0.18); }
        #taskbar-apps button.active { background: rgba(192,132,252,0.25); border-color: #c084fc; }

        #notification-center { position: fixed; top: 20px; right: 20px; width: 320px; max-height: 400px; overflow: auto; background: rgba(10,10,25,0.9); backdrop-filter: blur(30px); border: 1px solid rgba(192,132,252,0.15); border-radius: 16px; padding: 12px; z-index: 3000; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        #notification-center.show { display: block; }
        .notification-item { padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 6px; border-left: 3px solid #c084fc; font-size: 13px; color: #e2e8f0; }
        .notification-item .time { font-size: 10px; color: #718096; margin-top: 4px; }

        .desktop-icon { position: absolute; width: 80px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; padding: 8px; }
        .desktop-icon:hover { background: rgba(192,132,252,0.1); border-color: rgba(192,132,252,0.2); transform: scale(1.05); }
        .desktop-icon .icon { font-size: 32px; }
        .desktop-icon .label { font-size: 11px; color: #e2e8f0; text-align: center; margin-top: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

        .window { position: absolute; min-width: 320px; min-height: 200px; background: rgba(10,10,25,0.88); backdrop-filter: blur(30px); border-radius: 14px; border: 1px solid rgba(192,132,252,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; animation: windowOpen 0.25s ease-out; }
        @keyframes windowOpen { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .window-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(20,20,40,0.6); cursor: grab; border-bottom: 1px solid rgba(192,132,252,0.08); flex-shrink: 0; }
        .window-header:active { cursor: grabbing; }
        .window-title { font-size: 13px; color: #e2e8f0; font-weight: 500; }
        .window-controls { display: flex; gap: 8px; }
        .window-controls button { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.5); transition: 0.2s; }
        .window-controls button:hover { transform: scale(1.1); }
        .window-controls .close { background: #f7768e; }
        .window-controls .minimize { background: #f6ad55; }
        .window-controls .maximize { background: #81e6d9; }
        .window-body { flex: 1; padding: 12px; overflow: auto; color: #e2e8f0; font-size: 14px; background: rgba(5,5,15,0.3); }
        .window-body input, .window-body textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(192,132,252,0.15); color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; }
        .window-body input:focus, .window-body textarea:focus { border-color: #c084fc; }
        .window-body textarea { height: 100%; resize: none; }

        .widget { position: absolute; background: rgba(10,10,25,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(192,132,252,0.1); border-radius: 16px; padding: 12px 16px; min-width: 120px; color: #e2e8f0; font-size: 13px; }
        .widget-clock { top: 20px; right: 20px; text-align: right; }
        .widget-clock .time { font-size: 28px; font-weight: 300; color: #c084fc; }
        .widget-clock .date { font-size: 13px; color: #a0aec0; }
        .widget-weather { top: 100px; right: 20px; text-align: center; min-width: 140px; }
        .widget-weather .temp { font-size: 26px; font-weight: 300; color: #81e6d9; }
        .widget-weather .desc { font-size: 13px; color: #a0aec0; }
        .widget-cpu { bottom: 80px; right: 20px; min-width: 130px; }
        .widget-cpu .bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 4px; overflow: hidden; }
        .widget-cpu .bar-fill { height: 100%; background: #c084fc; border-radius: 4px; transition: width 0.5s; width: 45%; }
        .widget-ram { bottom: 140px; right: 20px; min-width: 130px; }
        .widget-ram .bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 4px; overflow: hidden; }
        .widget-ram .bar-fill { height: 100%; background: #81e6d9; border-radius: 4px; transition: width 0.5s; width: 60%; }

        @media (max-width: 768px) {
            .desktop-icon { width: 60px; height: 60px; }
            .desktop-icon .icon { font-size: 24px; }
            .desktop-icon .label { font-size: 10px; }
            .window { min-width: 90vw; min-height: 60vh; left: 5vw !important; top: 10vh !important; }
            #dock { display: none; }
            #taskbar .start-btn span { display: none; }
            #taskbar .clock { font-size: 12px; }
            .widget-clock, .widget-weather, .widget-cpu, .widget-ram { display: none; }
        }
    </style>
</head>
<body>
    <div id="desktop">
        <div class="workspace active" data-workspace="0">
            <div class="widget widget-clock">
                <div class="time" id="widget-time">00:00</div>
                <div class="date" id="widget-date">00.00.0000</div>
            </div>
            <div class="widget widget-weather">
                <div class="temp" id="widget-temp">22°C</div>
                <div class="desc" id="widget-desc">Ясно ☀️</div>
            </div>
            <div class="widget widget-cpu">
                <div>⚡ CPU</div>
                <div class="bar"><div class="bar-fill" id="widget-cpu-fill" style="width:45%;"></div></div>
                <div style="margin-top:4px; font-size:11px; color:#a0aec0;">45%</div>
            </div>
            <div class="widget widget-ram">
                <div>🧠 RAM</div>
                <div class="bar"><div class="bar-fill" id="widget-ram-fill" style="width:60%;"></div></div>
                <div style="margin-top:4px; font-size:11px; color:#a0aec0;">6.2 / 8.0 ГБ</div>
            </div>
        </div>
    </div>

    <div id="dock">
        <button class="dock-icon active" onclick="openTerminal()" title="Терминал">💻<span class="dot"></span></button>
        <button class="dock-icon" onclick="openNovaAI()" title="Nova AI">🧠</button>
        <button class="dock-icon" onclick="openFileManager()" title="Файлы">📁</button>
        <button class="dock-icon" onclick="openTextEditor()" title="Редактор">📝</button>
        <button class="dock-icon" onclick="openCalculator()" title="Калькулятор">🧮</button>
        <button class="dock-icon" onclick="openCalendar()" title="Календарь">📅</button>
        <button class="dock-icon" onclick="openMusicPlayer()" title="Музыка">🎵</button>
        <button class="dock-icon" onclick="openSettings()" title="Настройки">⚙️</button>
        <button class="dock-icon" onclick="notify('📢 Уведомление')" title="Уведомления">🔔</button>
        <button class="dock-icon" onclick="switchWorkspace()" title="Рабочие столы">🖥️</button>
    </div>

    <div id="taskbar">
        <button class="start-btn" onclick="showStartMenu()"><span>🧊</span><span>Пуск</span></button>
        <div id="taskbar-apps"></div>
        <div class="clock" id="clock"><span id="taskbar-time">00:00</span><span class="date" id="taskbar-date">00.00.0000</span></div>
    </div>

    <div id="notification-center">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-weight:bold; color:#c084fc;">🔔 Уведомления</span>
            <button onclick="document.getElementById('notification-center').classList.remove('show')" style="background:none; border:none; color:#718096; cursor:pointer;">✕</button>
        </div>
        <div id="notification-list"><div class="notification-item">🧊 Добро пожаловать в Nova OS Ultimate 3.0!</div></div>
    </div>

    <script>
        // ================================================================
        //  NOVA OS ULTIMATE 3.0 — ВСЁ ВКЛЮЧЕНО
        // ================================================================

        const desktop = document.getElementById('desktop');
        const taskbarApps = document.getElementById('taskbar-apps');
        const clock = document.getElementById('clock');
        const notification = document.getElementById('notification');

        let windowIdCounter = 0;
        let windows = [];
        let zIndexCounter = 100;
        let terminalPath = '/home/nova';
        let currentWorkspace = 0;
        let fileSystem = {
            '/': {
                type: 'folder',
                children: {
                    'home': { type: 'folder', children: { 'nova': { type: 'folder', children: {
                        'Documents': { type: 'folder', children: {} },
                        'Downloads': { type: 'folder', children: {} },
                        'Projects': { type: 'folder', children: {} },
                        'Pictures': { type: 'folder', children: {} },
                        'Music': { type: 'folder', children: {} },
                        'Videos': { type: 'folder', children: {} },
                        'readme.txt': { type: 'file', content: '🧊 Добро пожаловать в Nova OS Ultimate 3.0!' }
                    } } } },
                    'etc': { type: 'folder', children: { 'hostname': { type: 'file', content: 'nova-os' } } },
                    'var': { type: 'folder', children: { 'log': { type: 'folder', children: {} } } },
                    'tmp': { type: 'folder', children: {} },
                    'usr': { type: 'folder', children: { 'bin': { type: 'folder', children: {} } } }
                }
            }
        };

        let terminalHistory = [];
        let terminalHistoryIndex = -1;

        function notify(message, duration = 4000) {
            const list = document.getElementById('notification-list');
            const item = document.createElement('div');
            item.className = 'notification-item';
            item.innerHTML = `${message}<div class="time">${new Date().toLocaleTimeString()}</div>`;
            list.prepend(item);
            if (list.children.length > 10) list.removeChild(list.lastChild);
        }

        function createWindow(title, content, width = 500, height = 400) {
            const id = ++windowIdCounter;
            const win = document.createElement('div');
            win.className = 'window';
            win.style.width = width + 'px';
            win.style.height = height + 'px';
            win.style.left = (50 + Math.random() * 200) + 'px';
            win.style.top = (50 + Math.random() * 100) + 'px';
            win.style.zIndex = ++zIndexCounter;
            win.dataset.id = id;
            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${title}</span>
                    <div class="window-controls">
                        <button class="minimize" onclick="minimizeWindow(${id})">−</button>
                        <button class="maximize" onclick="maximizeWindow(${id})">+</button>
                        <button class="close" onclick="closeWindow(${id})">×</button>
                    </div>
                </div>
                <div class="window-body">${content}</div>
            `;
            document.body.appendChild(win);
            const taskBtn = document.createElement('button');
            taskBtn.textContent = title;
            taskBtn.dataset.windowId = id;
            taskBtn.onclick = () => {
                const w = document.querySelector(`.window[data-id="${id}"]`);
                if (w) { w.style.display = w.style.display === 'none' ? 'flex' : 'none'; taskBtn.classList.toggle('active'); }
            };
            taskbarApps.appendChild(taskBtn);
            windows.push({ id, element: win, taskBtn });
            const header = win.querySelector('.window-header');
            let isDragging = false, offsetX, offsetY;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.window-controls')) return;
                isDragging = true;
                const rect = win.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                win.style.zIndex = ++zIndexCounter;
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', () => { isDragging = false; document.removeEventListener('mousemove', onDrag); });
            });
            function onDrag(e) { if (!isDragging) return; win.style.left = (e.clientX - offsetX) + 'px'; win.style.top = (e.clientY - offsetY) + 'px'; }
            return id;
        }

        function closeWindow(id) {
            const win = document.querySelector(`.window[data-id="${id}"]`);
            const taskBtn = document.querySelector(`[data-window-id="${id}"]`);
            if (win) { win.style.animation = 'windowOpen 0.15s reverse'; setTimeout(() => win.remove(), 150); }
            if (taskBtn) taskBtn.remove();
            windows = windows.filter(w => w.id !== id);
        }

        function minimizeWindow(id) {
            const win = document.querySelector(`.window[data-id="${id}"]`);
            const taskBtn = document.querySelector(`[data-window-id="${id}"]`);
            if (win) { win.style.display = win.style.display === 'none' ? 'flex' : 'none'; if (taskBtn) taskBtn.classList.toggle('active'); }
        }

        function maximizeWindow(id) {
            const win = document.querySelector(`.window[data-id="${id}"]`);
            if (win) {
                if (win.style.width === '100vw') {
                    win.style.width = '500px'; win.style.height = '400px'; win.style.left = '100px'; win.style.top = '100px'; win.style.borderRadius = '12px';
                } else {
                    win.style.width = '100vw'; win.style.height = 'calc(100vh - 60px)'; win.style.left = '0'; win.style.top = '0'; win.style.borderRadius = '0';
                }
            }
        }

        function getNode(path) {
            if (path === '/') return fileSystem['/'];
            const parts = path.split('/').filter(p => p);
            let current = fileSystem['/'];
            for (let i = 0; i < parts.length; i++) {
                if (!current.children || !current.children[parts[i]]) return null;
                current = current.children[parts[i]];
            }
            return current;
        }

        function listDirectory(path) {
            const node = getNode(path);
            if (!node || node.type !== 'folder') return [];
            return Object.keys(node.children);
        }

        function createFile(path, name, content = '') {
            const node = getNode(path);
            if (!node || node.type !== 'folder') return false;
            if (node.children[name]) return false;
            node.children[name] = { type: 'file', content: content };
            return true;
        }

        function createFolder(path, name) {
            const node = getNode(path);
            if (!node || node.type !== 'folder') return false;
            if (node.children[name]) return false;
            node.children[name] = { type: 'folder', children: {} };
            return true;
        }

        function deleteNode(path, name) {
            const node = getNode(path);
            if (!node || node.type !== 'folder') return false;
            if (!node.children[name]) return false;
            delete node.children[name];
            return true;
        }

        function readFile(path) {
            const node = getNode(path);
            if (!node || node.type !== 'file') return null;
            return node.content;
        }

        function writeFile(path, content) {
            const node = getNode(path);
            if (!node || node.type !== 'file') return false;
            node.content = content;
            return true;
        }

        function switchWorkspace() {
            const workspaces = document.querySelectorAll('.workspace');
            currentWorkspace = (currentWorkspace + 1) % 3;
            workspaces.forEach((ws, i) => { ws.classList.toggle('active', i === currentWorkspace); });
            notify(`🖥️ Рабочий стол ${currentWorkspace + 1}`);
        }

        function executeCommand(cmd, output) {
            const parts = cmd.trim().split(' ');
            const command = parts[0];
            const args = parts.slice(1);
            let result = '';

            switch (command) {
                case 'ls': { const files = listDirectory(terminalPath); result = files.join('  ') || '(пусто)'; break; }
                case 'pwd': result = terminalPath; break;
                case 'cd': {
                    if (!args[0]) { terminalPath = '/home/nova'; }
                    else if (args[0] === '..') { terminalPath = terminalPath.split('/').slice(0, -1).join('/') || '/'; }
                    else { const newPath = terminalPath + '/' + args[0]; const node = getNode(newPath); if (node && node.type === 'folder') { terminalPath = newPath; } else { result = `❌ Папка не найдена: ${args[0]}`; } }
                    return;
                }
                case 'mkdir': { if (args[0]) { if (createFolder(terminalPath, args[0])) { result = `✅ Папка создана: ${args[0]}`; } else { result = `❌ Не удалось создать папку: ${args[0]}`; } } break; }
                case 'touch': { if (args[0]) { if (createFile(terminalPath, args[0])) { result = `✅ Файл создан: ${args[0]}`; } else { result = `❌ Не удалось создать файл: ${args[0]}`; } } break; }
                case 'cat': { if (args[0]) { const content = readFile(terminalPath + '/' + args[0]); if (content !== null) { result = content; } else { result = `❌ Файл не найден: ${args[0]}`; } } break; }
                case 'echo': result = args.join(' '); break;
                case 'date': result = new Date().toString(); break;
                case 'whoami': result = 'nova'; break;
                case 'uname': result = 'Nova OS Ultimate 3.0'; break;
                case 'clear': output.innerHTML = ''; return;
                case 'rm': { if (args[0]) { if (deleteNode(terminalPath, args[0])) { result = `✅ Удалено: ${args[0]}`; } else { result = `❌ Не удалось удалить: ${args[0]}`; } } break; }
                case 'tree': {
                    function printTree(node, prefix = '') {
                        let lines = [];
                        const keys = Object.keys(node.children || {});
                        keys.forEach((key, i) => {
                            const isLast = i === keys.length - 1;
                            lines.push(prefix + (isLast ? '└── ' : '├── ') + key);
                            if (node.children[key].type === 'folder') {
                                lines = lines.concat(printTree(node.children[key], prefix + (isLast ? '    ' : '│   ')));
                            }
                        });
                        return lines;
                    }
                    const node = getNode(terminalPath);
                    if (node && node.type === 'folder') { result = terminalPath + '\n' + printTree(node).join('\n'); }
                    else { result = '❌ Не папка'; }
                    break;
                }
                case 'history': { result = terminalHistory.map((c, i) => `${i}: ${c}`).join('\n'); break; }
                case 'help': {
                    result = `Доступные команды:
                    ls, cd, pwd, mkdir, touch, cat, echo, date, whoami, uname, clear, rm, tree, history, help
                    Стрелки ↑↓ — история команд`;
                    break;
                }
                default: { result = `❌ Команда не найдена: ${command}. Введите 'help' для списка.`; }
            }

            if (result) {
                output.innerHTML += `<div><span style="color:#c084fc;">${terminalPath}$</span> ${cmd}</div>`;
                output.innerHTML += `<div style="color:#81e6d9; white-space:pre-wrap;">${result}</div>`;
                output.scrollTop = output.scrollHeight;
            }
        }

        // --- ПРИЛОЖЕНИЯ ---

        function openTerminal() {
            const content = `
                <div style="height:100%; display:flex; flex-direction:column;">
                    <div id="terminal-output" style="flex:1; background:rgba(0,0,0,0.4); border-radius:8px; padding:10px; font-family:monospace; font-size:13px; overflow:auto; white-space:pre-wrap; min-height:100px; border:1px solid rgba(192,132,252,0.08);">
                        <div style="color:#81e6d9;">🧊 Nova Shell — Ultimate 3.0</div>
                        <div><span style="color:#c084fc;">/home/nova$</span> </div>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <input id="terminal-input" type="text" style="flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(192,132,252,0.15); color:#e2e8f0; padding:6px 10px; border-radius:6px; font-family:monospace; font-size:13px; outline:none;" placeholder="Введите команду..." autofocus>
                        <button id="terminal-send" style="background:#c084fc; border:none; color:#0a0a1a; padding:6px 14px; border-radius:8px; cursor:pointer;">Enter</button>
                    </div>
                </div>
            `;
            const id = createWindow('💻 Терминал', content, 600, 400);
            setTimeout(() => {
                const input = document.getElementById('terminal-input');
                const output = document.getElementById('terminal-output');
                const send = document.getElementById('terminal-send');

                function sendCommand() {
                    const cmd = input.value.trim();
                    if (!cmd) return;
                    terminalHistory.push(cmd);
                    terminalHistoryIndex = terminalHistory.length;
                    input.value = '';
                    executeCommand(cmd, output);
                    output.innerHTML += `<div><span style="color:#c084fc;">${terminalPath}$</span> </div>`;
                    output.scrollTop = output.scrollHeight;
                }

                send.onclick = sendCommand;
                input.addEventListener('keydown', (e) => {

        function openCalculator() {
            let calcExpression = '';
            const content = `
                <div style="height:100%; display:flex; flex-direction:column; gap:12px;">
                    <div style="width:100%; background:rgba(0,0,0,0.3); border-radius:8px; padding:12px; text-align:right; font-size:28px; font-weight:300; min-height:50px; color:#e2e8f0;" id="calc-display">0</div>
                    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:100%; max-width:300px;">
                        ${['C', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '=', '⌫'].map(btn => `
                            <button onclick="calcPress('${btn}')" style="background:${['C','±','%','÷','×','−','+','='].includes(btn) ? 'rgba(192,132,252,0.3)' : 'rgba(255,255,255,0.05)'}; border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:12px; color:#e2e8f0; font-size:18px; cursor:pointer; transition:0.2s;" 
                                    onmouseenter="this.style.background='rgba(192,132,252,0.2)'" 
                                    onmouseleave="this.style.background='${['C','±','%','÷','×','−','+','='].includes(btn) ? 'rgba(192,132,252,0.3)' : 'rgba(255,255,255,0.05)'}'">
                                ${btn}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            createWindow('🧮 Калькулятор', content, 350, 450);
            window.calcPress = function(btn) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (btn === 'C') { calcExpression = ''; display.textContent = '0'; return; }
                if (btn === '⌫') { calcExpression = calcExpression.slice(0, -1); display.textContent = calcExpression || '0'; return; }
                if (btn === '=') {
                    try {
                        const result = Function('"use strict"; return (' + calcExpression.replace(/×/g, '*').replace(/÷/g, '/') + ')')();
                        display.textContent = result;
                        calcExpression = String(result);
                    } catch { display.textContent = 'Ошибка'; calcExpression = ''; }
                    return;
                }
                if (btn === '±') {
                    if (calcExpression.startsWith('-')) { calcExpression = calcExpression.slice(1); } else { calcExpression = '-' + calcExpression; }
                    display.textContent = calcExpression || '0';
                    return;
                }
                const operators = ['+', '−', '×', '÷'];
                if (operators.includes(btn)) {
                    const op = btn === '×' ? '*' : btn === '÷' ? '/' : btn === '−' ? '-' : '+';
                    calcExpression += op;
                } else { calcExpression += btn; }
                display.textContent = calcExpression || '0';
            };
        }

            ['💻', 'Терминал', openTerminal, 30, 30],
            ['🧠', 'Nova AI', openNovaAI, 140, 30],
            ['📁', 'Файлы', openFileManager, 250, 30],
            ['📝', 'Редактор', openTextEditor, 360, 30],
            ['🧮', 'Калькулятор', openCalculator, 470, 30],
            ['📅', 'Календарь', openCalendar, 580, 30],
            ['🎵', 'Музыка', openMusicPlayer, 690, 30],
            ['⚙️', 'Настройки', openSettings, 800, 30],
        ];

        icons.forEach(([icon, label, action, x, y]) => {
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerHTML = `<div class="icon">${icon}</div><div class="label">${label}</div>`;
            el.onclick = action;
            el.ondblclick = action;
            desktop.appendChild(el);
        });

        setTimeout(() => {
            notify('🧊 Добро пожаловать в Nova OS Ultimate 3.0!');
            notify('📦 Всё, что есть в настоящих ОС — теперь здесь');
        }, 500);
    </script>
</body>
</html>
