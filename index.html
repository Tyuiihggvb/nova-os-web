<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐧 Nova Linux Ultimate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; }

        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: #00ff00;
        }
        #boot-log { width: 90%; max-width: 700px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99998; display: none;
            align-items: center; justify-content: center;
            flex-direction: column; color: #00ff00;
        }
        .login-box {
            border: 1px solid #00ff00; border-radius: 10px;
            padding: 30px; width: 90%; max-width: 350px;
            text-align: center;
        }
        .login-input {
            width: 100%; background: #000;
            border: 1px solid #00ff00; color: #00ff00;
            padding: 12px; border-radius: 5px; margin: 10px 0;
            font-size: 16px; outline: none; font-family: 'Courier New', monospace;
        }
        .login-btn {
            width: 100%; background: #00ff00; border: none;
            color: #000; padding: 12px; border-radius: 5px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 20px; font-family: 'Courier New', monospace;
        }

        #terminal {
            width: 100vw; height: 100vh;
            background: #000; color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px; padding: 20px;
            overflow-y: auto; display: none;
            white-space: pre-wrap; word-wrap: break-word;
        }
        #terminal-input-line { display: flex; align-items: center; }
        #terminal-prompt { color: #00ff00; white-space: nowrap; }
        #terminal-input {
            flex: 1; background: transparent; border: none;
            color: #00ff00; font-family: 'Courier New', monospace;
            font-size: 14px; outline: none; caret-color: #00ff00;
        }

        @media (max-width: 768px) {
            #terminal { font-size: 12px; padding: 10px; }
            #terminal-input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div style="font-size: 48px; margin-bottom: 30px;">🐧</div>
        <div style="font-size: 24px; margin-bottom: 20px;">Nova Linux Ultimate</div>
        <div id="boot-log"></div>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <div style="font-size: 60px; margin-bottom: 20px;">🐧</div>
            <div style="font-size: 24px; margin-bottom: 20px;">Nova Linux</div>
            <div style="margin-bottom: 10px;">nova-linux login:</div>
            <input type="text" id="login-username" class="login-input" placeholder="username" value="nova" autocomplete="off">
            <div style="margin: 10px 0;">Password:</div>
            <input type="password" id="login-password" class="login-input" placeholder="password" value="1234">
            <button onclick="login()" class="login-btn">Login</button>
        </div>
    </div>

    <div id="terminal"></div>

    <script>
        // ============ BOOT ============
        const bootMessages = [
            'BIOS: Nova Virtual BIOS v3.0',
            'CPU: Nova Virtual CPU @ 3.0GHz (4 cores)',
            'RAM: 8192MB detected',
            'AHCI: SATA controller initialized',
            'Loading Linux 5.15.0-nova...',
            'Decompressing kernel... done',
            'Booting the kernel...',
            'ACPI: Initializing ACPI subsystem',
            'PCI: Probing PCI hardware',
            'EXT4-fs (sda1): mounted filesystem',
            'systemd[1]: Reached target Multi-User System',
            'systemd[1]: Started Login Service',
            '',
            'Nova Linux 5.15.0-nova (nova-os) (tty1)',
            ''
        ];

        function bootSystem() {
            const bootLog = document.getElementById('boot-log');
            let index = 0;
            
            function showNext() {
                if (index < bootMessages.length) {
                    bootLog.innerHTML += bootMessages[index] + '\n';
                    index++;
                    setTimeout(showNext, Math.random() * 200 + 100);
                } else {
                    setTimeout(() => {
                        document.getElementById('boot-screen').style.display = 'none';
                        document.getElementById('login-screen').style.display = 'flex';
                    }, 500);
                }
            }
            showNext();
        }

        // ============ LINUX SYSTEM ============
        class LinuxSystem {
            constructor() {
                this.hostname = 'nova-linux';
                this.kernel = '5.15.0-nova';
                this.currentUser = null;
                this.currentPath = '/home/nova';
                this.processes = [];
                this.nextPid = 1;
                this.history = [];
                this.historyIndex = -1;
                this.envVars = {
                    HOME: '/home/nova',
                    PATH: '/usr/local/bin:/usr/bin:/bin',
                    SHELL: '/bin/bash',
                    USER: 'nova'
                };
                
                this.users = {
                    root: { password: 'root', uid: 0, home: '/root', shell: '/bin/bash' },
                    nova: { password: '1234', uid: 1000, home: '/home/nova', shell: '/bin/bash' }
                };
                
                this.fs = this.initFilesystem();
                this.packages = [
                    'bash', 'coreutils', 'systemd', 'linux-kernel',
                    'network-manager', 'vim', 'nano', 'gcc',
                    'python3', 'nodejs', 'openssh', 'grep',
                    'find', 'sed', 'awk', 'tar', 'gzip', 'zip'
                ];
                this.dmesg = [];
                this.initSystem();
            }
            
            initFilesystem() {
                return {
                    '/': {
                        type: 'dir',
                        children: {
                            'bin': { type: 'dir', children: {} },
                            'boot': { type: 'dir', children: {} },
                            'dev': { type: 'dir', children: {} },
                            'etc': {
                                type: 'dir',
                                children: {
                                    'hostname': { type: 'file', content: 'nova-linux\n' },
                                    'passwd': { 
                                        type: 'file', 
                                        content: 'root:x:0:0:root:/root:/bin/bash\nnova:x:1000:1000:Nova:/home/nova:/bin/bash\n' 
                                    },
                                    'os-release': {
                                        type: 'file',
                                        content: 'NAME="Nova Linux"\nVERSION="5.15.0-nova"\nID=nova\n'
                                    },
                                    'fstab': {
                                        type: 'file',
                                        content: '/dev/sda1  /       ext4    defaults    0 1\n/dev/sda2  swap    swap    defaults    0 0\n'
                                    }
                                }
                            },
                            'home': {
                                type: 'dir',
                                children: {
                                    'nova': {
                                        type: 'dir',
                                        children: {
                                            'Documents': { type: 'dir', children: {
                                                'notes.txt': { type: 'file', content: 'My notes\nLine 2\n' }
                                            }},
                                            'Downloads': { type: 'dir', children: {} },
                                            '.bashrc': { 
                                                type: 'file', 
                                                content: '# ~/.bashrc\nalias ll="ls -la"\nalias la="ls -A"\n' 
                                            },
                                            'readme.txt': { 
                                                type: 'file', 
                                                content: 'Welcome to Nova Linux!\nThis is a full Linux system.\n' 
                                            },
                                            'test.txt': {
                                                type: 'file',
                                                content: 'apple\nbanana\ncherry\ndate\nelderberry\n'
                                            }
                                        }
                                    },
                                    'root': { type: 'dir', children: {} }
                                }
                            },
                            'proc': { type: 'dir', children: {} },
                            'tmp': { type: 'dir', children: {} },
                            'usr': {
                                type: 'dir',
                                children: {
                                    'bin': { type: 'dir', children: {} },
                                    'lib': { type: 'dir', children: {} }
                                }
                            },
                            'var': {
                                type: 'dir',
                                children: {
                                    'log': { type: 'dir', children: {
                                        'syslog': { type: 'file', content: 'System logs\n' }
                                    }}
                                }
                            }
                        }
                    }
                };
            }
            
            initSystem() {
                this.processes.push({ pid: 1, name: 'systemd', user: 'root', status: 'running', cpu: 0.1, mem: 100 });
                this.processes.push({ pid: 2, name: 'kthreadd', user: 'root', status: 'running', cpu: 0.0, mem: 0 });
                this.processes.push({ pid: 3, name: 'bash', user: 'nova', status: 'running', cpu: 0.5, mem: 50 });
                this.processes.push({ pid: 4, name: 'network-manager', user: 'root', status: 'running', cpu: 0.2, mem: 75 });
                
                this.dmesg.push('[    0.000000] Linux version 5.15.0-nova');
                this.dmesg.push('[    0.000000] Command line: BOOT_IMAGE=/boot/vmlinuz');
                this.dmesg.push('[    0.100000] Memory: 8192000K/8388608K available');
                this.dmesg.push('[    0.500000] EXT4-fs (sda1): mounted filesystem');
                this.dmesg.push('[    1.000000] network-manager: started');
            }
            
            login(username, password) {
                const user = this.users[username];
                if (user && user.password === password) {
                    this.currentUser = username;
                    this.currentPath = user.home;
                    this.envVars.USER = username;
                    this.envVars.HOME = user.home;
                    return true;
                }
                return false;
            }
            
            getNode(path) {
                if (path === '/') return this.fs['/'];
                const parts = path.split('/').filter(p => p);
                let current = this.fs['/'];
                for (let part of parts) {
                    if (!current.children || !current.children[part]) return null;
                    current = current.children[part];
                }
                return current;
            }
            
            listDir(path) {
                const node = this.getNode(path);
                if (!node || node.type !== 'dir') return [];
                return Object.keys(node.children);
            }
            
            createFile(path, name, content = '') {
                const node = this.getNode(path);
                if (!node || node.type !== 'dir') return false;
                if (node.children[name]) return false;
                node.children[name] = { type: 'file', content: content };
                return true;
            }
            
            createDir(path, name) {
                const node = this.getNode(path);
                if (!node || node.type !== 'dir') return false;
                if (node.children[name]) return false;
                node.children[name] = { type: 'dir', children: {} };
                return true;
            }
            
            deleteNode(path, name) {
                const node = this.getNode(path);
                if (!node || node.type !== 'dir') return false;
                if (!node.children[name]) return false;
                delete node.children[name];
                return true;
            }
            
            readFile(path) {
                const node = this.getNode(path);
                if (!node || node.type !== 'file') return null;
                return node.content;
            }
            
            findFiles(startPath, pattern, results = []) {
                const node = this.getNode(startPath);
                if (!node || node.type !== 'dir') return results;
                
                for (const [name, child] of Object.entries(node.children)) {
                    const fullPath = startPath + '/' + name;
                    if (name.includes(pattern)) {
                        results.push(fullPath);
                    }
                    if (child.type === 'dir') {
                        this.findFiles(fullPath, pattern, results);
                    }
                }
                return results;
            }
            
            executeCommand(cmd) {
                if (cmd.includes('|')) {
                    const commands = cmd.split('|').map(c => c.trim());
                    let output = '';
                    for (let i = 0; i < commands.length; i++) {
                        output = this.executeSingleCommand(commands[i], output);
                    }
                    return output;
                }
                
                if (cmd.includes('>')) {
                    const [cmdPart, filePart] = cmd.split('>').map(s => s.trim());
                    const output = this.executeSingleCommand(cmdPart);
                    const fileName = filePart.replace('>', '').trim();
                    const node = this.getNode(this.currentPath);
                    if (node && node.type === 'dir') {
                        node.children[fileName] = { type: 'file', content: output };
                        return '';
                    }
                }
                
                return this.executeSingleCommand(cmd, '');
            }
            
            executeSingleCommand(cmd, input = '') {
                const parts = cmd.trim().split(' ');
                const command = parts[0];
                const args = parts.slice(1);
                
                switch(command) {
                    case 'ls': {
                        const files = this.listDir(this.currentPath);
                        if (args[0] === '-la' || args[0] === '-al') {
                            let result = 'total ' + (files.length * 4) + '\n';
                            files.forEach(f => {
                                const node = this.getNode(this.currentPath + '/' + f);
                                const type = node.type === 'dir' ? 'd' : '-';
                                const perms = type + 'rwxr-xr-x';
                                const owner = this.currentUser;
                                const size = node.type === 'file' ? (node.content || '').length : 4096;
                                const date = new Date().toLocaleDateString('ru-RU');
                                result += `${perms} ${owner} ${owner} ${String(size).padStart(6)} ${date} ${f}\n`;
                            });
                            return result;
                        }
                        if (args[0] === '-a') {
                            return ['.', '..', ...files].join('  ');
                        }
                        return files.join('  ') || '';
                    }
                    
                    case 'pwd': return this.currentPath;
                    
                    case 'cd': {
                        if (!args[0] || args[0] === '~') {
                            this.currentPath = this.users[this.currentUser].home;
                        } else if (args[0] === '..') {
                            this.currentPath = this.currentPath.split('/').slice(0, -1).join('/') || '/';
                        } else if (args[0] === '-') {
                            this.currentPath = this.envVars.OLDPWD || this.users[this.currentUser].home;
                        } else if (args[0] === '/') {
                            this.currentPath = '/';
                        } else {
                            const newPath = args[0].startsWith('/') ? args[0] : this.currentPath + '/' + args[0];
                            const node = this.getNode(newPath);
                            if (node && node.type === 'dir') {
                                this.envVars.OLDPWD = this.currentPath;
                                this.currentPath = newPath;
                            } else {
                                return `bash: cd: ${args[0]}: No such file or directory`;
                            }
                        }
                        return '';
                    }
                    
                    case 'cat': {
                        if (args[0]) {
                            const content = this.readFile(this.currentPath + '/' + args[0]);
                            if (content !== null) return content;
                            return `cat: ${args[0]}: No such file or directory`;
                        }
                        return input;
                    }
                    
                    case 'echo': return args.join(' ');
                    
                    case 'grep': {
                        const pattern = args[0];
                        const text = args.slice(1).join(' ') || input;
                        if (!pattern) return 'Usage: grep <pattern> [file]';
                        
                        if (args[1] && !args[1].startsWith('-')) {
                            const content = this.readFile(this.currentPath + '/' + args[1]);
                            if (content) {
                                return content.split('\n').filter(line => line.includes(pattern)).join('\n');
                            }
                        }
                        
                        if (input) {
                            return input.split('\n').filter(line => line.includes(pattern)).join('\n');
                        }
                        
                        return '';
                    }
                    
                    case 'find': {
                        const startPath = args[0] || this.currentPath;
                        const pattern = args[1] || '*';
                        const results = this.findFiles(startPath, pattern.replace('*', ''));
                        return results.join('\n');
                    }
                    
                    case 'wc': {
                        const text = args[1] ? this.readFile(this.currentPath + '/' + args[1]) : input;
                        if (args[0] === '-l') return String(text.split('\n').length);
                        if (args[0] === '-w') return String(text.split(/\s+/).length);
                        if (args[0] === '-c') return String(text.length);
                        return `${text.split('\n').length} ${text.split(/\s+/).length} ${text.length}`;
                    }
                    
                    case 'sort': {
                        const text = args[0] ? this.readFile(this.currentPath + '/' + args[0]) : input;
                        return text.split('\n').sort().join('\n');
                    }
                    
                    case 'uniq': {
                        const text = args[0] ? this.readFile(this.currentPath + '/' + args[0]) : input;
                        const lines = text.split('\n');
                        return lines.filter((line, i) => line !== lines[i-1]).join('\n');
                    }
                    
                    case 'head': {
                        const count = args[0] === '-n' ? parseInt(args[1]) : 10;
                        const text = args[2] ? this.readFile(this.currentPath + '/' + args[2]) : input;
                        return text.split('\n').slice(0, count).join('\n');
                    }
                    
                    case 'tail': {
                        const count = args[0] === '-n' ? parseInt(args[1]) : 10;
                        const text = args[2] ? this.readFile(this.currentPath + '/' + args[2]) : input;
                        return text.split('\n').slice(-count).join('\n');
                    }
                    
                    case 'mkdir': {
                        if (args[0]) {
                            if (this.createDir(this.currentPath, args[0])) return '';
                            return `mkdir: cannot create directory '${args[0]}': File exists`;
                        }
                        return 'Usage: mkdir <directory>';
                    }
                    
                    case 'touch': {
                        if (args[0]) {
                            if (this.createFile(this.currentPath, args[0])) return '';
                            return `touch: cannot touch '${args[0]}': File exists`;
                        }
                        return 'Usage: touch <file>';
                    }
                    
                    case 'rm': {
                        if (args[0] === '-rf' && args[1]) {
                            if (this.deleteNode(this.currentPath, args[1])) return '';
                            return `rm: cannot remove '${args[1]}': No such file or directory`;
                        }
                        if (args[0]) {
                            if (this.deleteNode(this.currentPath, args[0])) return '';
                            return `rm: cannot remove '${args[0]}': No such file or directory`;
                        }
                        return 'Usage: rm <file>';
                    }
                    
                    case 'cp': {
                        if (args[0] && args[1]) {
                            const content = this.readFile(this.currentPath + '/' + args[0]);
                            if (content !== null) {
                                if (this.createFile(this.currentPath, args[1], content)) return '';
                                return `cp: cannot create '${args[1]}': File exists`;
                            }
                            return `cp: cannot stat '${args[0]}': No such file`;
                        }
                        return 'Usage: cp <source> <destination>';
                    }
                    
                    case 'mv': {
                        if (args[0] && args[1]) {
                            const content = this.readFile(this.currentPath + '/' + args[0]);
                            if (content !== null) {
                                this.deleteNode(this.currentPath, args[0]);
                                this.createFile(this.currentPath, args[1], content);
                                return '';
                            }
                            return `mv: cannot stat '${args[0]}': No such file`;
                        }
                        return 'Usage: mv <source> <destination>';
                    }
                    
                    case 'ping': {
                        if (args[0]) {
                            return `PING ${args[0]} (8.8.8.8) 56(84) bytes of data.
64 bytes from 8.8.8.8: icmp_seq=1 ttl=64 time=12.5 ms
64 bytes from 8.8.8.8: icmp_seq=2 ttl=64 time=11.8 ms
64 bytes from 8.8.8.8: icmp_seq=3 ttl=64 time=12.1 ms

--- ${args[0]} ping statistics ---
3 packets transmitted, 3 received, 0% packet loss`;
                        }
                        return 'Usage: ping <host>';
                    }
                    
                    case 'ifconfig': {
                        return `eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500
        inet 192.168.1.100  netmask 255.255.255.0  broadcast 192.168.1.255
        ether 00:11:22:33:44:55

lo: flags=73<UP,LOOPBACK,RUNNING>  mtu 65536
        inet 127.0.0.1  netmask 255.0.0.0`;
                    }
                    
                    case 'netstat': {
                        return `Active Internet connections
Proto Local Address           Foreign Address         State
tcp   0.0.0.0:22              0.0.0.0:*               LISTEN
tcp   192.168.1.100:45678     8.8.8.8:443             ESTABLISHED`;
                    }
                    
                    case 'whoami': return this.currentUser;
                    case 'hostname': return this.hostname;
                    
                    case 'uname': {
                        if (args[0] === '-a') return `Linux ${this.hostname} ${this.kernel} #1 SMP x86_64 GNU/Linux`;
                        if (args[0] === '-r') return this.kernel;
                        return 'Linux';
                    }
                    
                    case 'date': return new Date().toString();
                    
                    case 'uptime': {
                        const uptime = Math.floor((Date.now() - bootTime) / 1000);
                        const hours = Math.floor(uptime / 3600);
                        const minutes = Math.floor((uptime % 3600) / 60);
                        return `up ${hours}:${minutes.toString().padStart(2, '0')}, 1 user, load average: 0.00, 0.00, 0.00`;
                    }
                    
                    case 'ps': {
                        if (args[0] === 'aux') {
                            let result = 'USER       PID  %CPU  %MEM  COMMAND\n';
                            this.processes.forEach(p => {
                                result += `${p.user.padEnd(8)} ${String(p.pid).padEnd(5)}  ${p.cpu.toFixed(1).padEnd(5)}  ${p.mem.toFixed(0).padEnd(6)} ${p.name}\n`;
                            });
                            return result;
                        }
                        let result = 'PID TTY          TIME CMD\n';
                        this.processes.forEach(p => {
                            result += `${String(p.pid).padEnd(4)} pts/0    00:00:00 ${p.name}\n`;
                        });
                        return result;
                    }
                    
                    case 'kill': {
                        if (args[0]) {
                            const pid = parseInt(args[0]);
                            const index = this.processes.findIndex(p => p.pid === pid);
                            if (index !== -1) {
                                this.processes.splice(index, 1);
                                return `Process ${pid} terminated`;
                            }
                            return `kill: (${pid}) - No such process`;
                        }
                        return 'Usage: kill <pid>';
                    }
                    
                    case 'df': {
                        if (args[0] === '-h') {
                            return 'Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1        20G  3.5G   16G  18% /';
                        }
                        return 'Filesystem     1K-blocks    Used Available Use% Mounted on\n/dev/sda1       20971520 3670016  17301504  18% /';
                    }
                    
                    case 'free': {
                        if (args[0] === '-h') {
                            return '              total        used        free\nMem:          8.0Gi       2.4Gi       5.6Gi\nSwap:         2.0Gi          0B       2.0Gi';
                        }
                        return 'Mem:        8192000     2457600     5734400\nSwap:       2097152           0     2097152';
                    }
                    
                    case 'lscpu': {
                        return `Architecture:            x86_64
CPU(s):                  4
Model name:              Nova Virtual CPU @ 3.0GHz
CPU MHz:                 3000.000`;
                    }
                    
                    case 'lsblk': {
                        return `NAME   MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT
sda      8:0    0   20G  0 disk
├─sda1   8:1    0   18G  0 part /
└─sda2   8:2    0    2G  0 part [SWAP]`;
                    }
                    
                    case 'dmesg': return this.dmesg.join('\n');
                    
                    case 'apt': {
                        if (args[0] === 'list') return this.packages.join('\n');
                        if (args[0] === 'install' && args[1]) {
                            if (!this.packages.includes(args[1])) {
                                this.packages.push(args[1]);
                                return `Installing ${args[1]}... Done`;
                            }
                            return `${args[1]} is already installed`;
                        }
                        if (args[0] === 'remove' && args[1]) {
                            const index = this.packages.indexOf(args[1]);
                            if (index !== -1) {
                                this.packages.splice(index, 1);
                                return `Removing ${args[1]}... Done`;
                            }
                            return `Package ${args[1]} is not installed`;
                        }
                        return 'Usage: apt list | apt install <pkg> | apt remove <pkg>';
                    }
                    
                    case 'id': {
                        return `uid=${this.users[this.currentUser].uid}(${this.currentUser}) gid=1000(nova) groups=1000(nova)`;
                    }
                    
                    case 'sudo': return 'nova is not in the sudoers file. This incident will be reported.';
                    
                    case 'su': {
                        if (args[0] === 'root') return 'Password: (type root)';
                        return `su: user ${args[0] || ''} does not exist`;
                    }
                    
                    case 'clear': return 'CLEAR';
                    case 'history': return this.history.map((c, i) => ` ${i+1}  ${c}`).join('\n');
                    case 'env': return Object.entries(this.envVars).map(([k, v]) => `${k}=${v}`).join('\n');
                    
                    case 'reboot': return 'System going down for reboot NOW!';
                    case 'shutdown': return 'System going down for poweroff NOW!';
                    case 'poweroff': return 'Powering off...';
                    
                    case 'help':
                        return `Available commands:
  Navigation: ls, cd, pwd
  Files: cat, echo, mkdir, touch, rm, cp, mv
  Text: grep, find, wc, sort, uniq, head, tail
  System: whoami, hostname, uname, date, uptime
  Processes: ps, kill, top
  Disk: df, free, lsblk, lscpu
  Network: ping, ifconfig, netstat
  Packages: apt
  Other: id, sudo, su, clear, history, env
  Pipes: | (e.g., ls | grep .txt)
  Redirect: > (e.g., echo hello > file.txt)`;
                        
                    case '': return '';
                    default: return `bash: ${command}: command not found`;
                }
            }
        }

        let linux = new LinuxSystem();
        let bootTime = Date.now();

        function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            if (linux.login(username, password)) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('terminal').style.display = 'block';
                initTerminal();
            } else {
                alert('Login incorrect');
            }
        }

        function initTerminal() {
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = `
                <div style="margin-bottom: 10px;">Nova Linux ${linux.kernel} (nova-os) (tty1)</div>
                <div style="margin-bottom: 20px;">nova-linux login: ${linux.currentUser}</div>
                <div style="margin-bottom: 20px;">Password: ••••</div>
                <div style="margin-bottom: 20px;">Last login: ${new Date().toLocaleString('ru-RU')} on tty1</div>
                <div style="margin-bottom: 10px;">Welcome to Nova Linux Ultimate!</div>
                <div id="terminal-output"></div>
                <div id="terminal-input-line">
                    <span id="terminal-prompt">${linux.currentUser}@${linux.hostname}:${linux.currentPath}$ </span>
                    <input id="terminal-input" type="text" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                </div>
            `;
            
            const input = document.getElementById('terminal-input');
            input.focus();
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const cmd = input.value;
                    input.value = '';
                    executeCommand(cmd);
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (linux.historyIndex > 0) {
                        linux.historyIndex--;
                        input.value = linux.history[linux.historyIndex] || '';
                    }
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (linux.historyIndex < linux.history.length - 1) {
                        linux.historyIndex++;
                        input.value = linux.history[linux.historyIndex] || '';
                    } else {
                        linux.historyIndex = linux.history.length;
                        input.value = '';
                    }
                }
            });
            
            terminal.addEventListener('click', () => input.focus());
        }

        function executeCommand(cmd) {
            const output = document.getElementById('terminal-output');
            const prompt = document.getElementById('terminal-prompt');
            
            output.innerHTML += `<div><span style="color:#00ff00;">${linux.currentUser}@${linux.hostname}:${linux.currentPath}$</span> ${cmd}</div>`;
            
            linux.history.push(cmd);
            linux.historyIndex = linux.history.length;
            
            const result = linux.executeCommand(cmd);
            
            if (result === 'CLEAR') {
                output.innerHTML = '';
            } else if (result !== '') {
                output.innerHTML += `<div style="white-space:pre-wrap;">${result}</div>`;
            }
            
            prompt.textContent = `${linux.currentUser}@${linux.hostname}:${linux.currentPath}$ `;
            
            const terminal = document.getElementById('terminal');
            terminal.scrollTop = terminal.scrollHeight;
            
            document.getElementById('terminal-input').focus();
        }

        bootSystem();
    </script>
</body>
